<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="124" height="124" x="2" y="2" fill="#2d3748" stroke="#1a202c" stroke-width="4" rx="14"/>
  
  <!-- Book spine (black binder on left) -->
  <rect x="14" y="14" width="12" height="100" fill="#0d1117" rx="1"/>
  
  <!-- Book spine 3D effect (top) -->
  <path d="M 14 14 L 26 14 L 26 16 L 14 16 Z" fill="#1a202c"/>
  
  <!-- Book spine 3D effect (bottom) -->
  <path d="M 14 114 L 26 114 L 26 112 L 14 112 Z" fill="#000000"/>
  
  <!-- Book cover (main body) -->
  <rect x="26" y="14" width="76" height="100" fill="#4a5568" rx="2" stroke="#2d3748" stroke-width="2"/>
  
  <!-- Book pages (visible from right edge) -->
  <rect x="28" y="16" width="72" height="96" fill="#f7fafc" rx="1"/>
  
  <!-- Page depth effect (stacked pages look) -->
  <rect x="98" y="17" width="2" height="94" fill="#e2e8f0"/>
  <rect x="96" y="18" width="2" height="92" fill="#cbd5e0"/>
  
  <!-- Colored bookmark tabs sticking out from top (representing log levels) -->
  <rect x="102" y="22" width="8" height="14" fill="#fc8181" rx="1"/>
  <rect x="102" y="40" width="8" height="14" fill="#f6e05e" rx="1"/>
  <rect x="102" y="58" width="8" height="14" fill="#68d391" rx="1"/>
  <rect x="102" y="76" width="8" height="14" fill="#76e4f7" rx="1"/>
  <rect x="102" y="94" width="8" height="14" fill="#a0aec0" rx="1"/>
  
  <!-- Log entries on pages (more lines for larger book) -->
  <rect x="36" y="26" width="54" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="33" width="50" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="40" width="48" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="47" width="52" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="54" width="46" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="61" width="54" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="68" width="50" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="75" width="44" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="82" width="52" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="89" width="48" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="96" width="46" height="3" fill="#cbd5e0" rx="1"/>
  <rect x="36" y="103" width="50" height="3" fill="#cbd5e0" rx="1"/>
</svg>
