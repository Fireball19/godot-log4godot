name: GdUnit4 Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MikeSchulze/gdunit4-action@v1
        with:
          godot-version: '4.6.1'
          paths: 'res://tests'
          timeout: 10
          version: 'v6.1.1'
          publish-report: false
          report-name: 'log4godot-test-report.xml'
